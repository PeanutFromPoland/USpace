name: uspace-demo

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb/01-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [private]

  migrate:
    image: ${API_IMAGE:?set API_IMAGE}
    command: ["python", "-m", "uspace_api.bootstrap"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      KINDSPOT_ENABLE_DEMO_RESIDENTS: ${KINDSPOT_ENABLE_DEMO_RESIDENTS:-false}
      KINDSPOT_DEMO_ACCOUNT_PASSWORD: ${KINDSPOT_DEMO_ACCOUNT_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  resident-mock:
    image: ${API_IMAGE:?set API_IMAGE}
    command: ["uvicorn", "uspace_api.mock_resident_api:app", "--host", "0.0.0.0", "--port", "8010"]
    restart: unless-stopped
    environment:
      KINDSPOT_RESIDENT_API_TOKEN: ${KINDSPOT_RESIDENT_API_TOKEN:?set KINDSPOT_RESIDENT_API_TOKEN}
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [resident_operator]

  api:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      USE_CHATGPT_API: ${USE_CHATGPT_API:-false}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      USPACE_REQUIRE_VISIT_FOR_VOTE: ${USPACE_REQUIRE_VISIT_FOR_VOTE:-false}
      USPACE_ALLOW_EXTERNAL_REVIEW_CONTENT: ${USPACE_ALLOW_EXTERNAL_REVIEW_CONTENT:-false}
      USPACE_RUN_WORKERS: "true"
      KINDSPOT_RESIDENT_API_URL: http://resident-mock:8010/verifications
      KINDSPOT_RESIDENT_API_TOKEN: ${KINDSPOT_RESIDENT_API_TOKEN:?set KINDSPOT_RESIDENT_API_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
      resident-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [private, resident_operator]

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    restart: unless-stopped
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DEMO_HOST: ${DEMO_HOST:?set DEMO_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [private]

networks:
  private:
  resident_operator:
    internal: true

volumes:
  postgres_data:
  ollama_data:
  caddy_data:
  caddy_config:
